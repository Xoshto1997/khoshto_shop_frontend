<nav
  class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50 transition-all duration-300 shadow-[0_2px_20px_rgba(0,0,0,0.01)]"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex justify-between items-center">
    <a
      routerLink="/"
      class="text-xl font-black text-slate-900 tracking-tight hover:opacity-90 transition-opacity"
    >
      Khoshto Shop<span class="text-indigo-600">.</span>
    </a>

    <div class="flex items-center gap-4">
      @if (isAdminUser) {
        <div class="flex items-center gap-2">
          <a
            routerLink="/admin/orders"
            class="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold hover:bg-slate-800 hover:shadow-lg transition-all duration-200 flex items-center gap-1.5"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span class="hidden md:inline">შეკვეთები</span>
          </a>

          <a
            routerLink="/add-product"
            class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold hover:bg-indigo-700 hover:shadow-lg hover:shadow-indigo-600/10 transition-all duration-200 flex items-center gap-1.5"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            <span class="hidden md:inline">პროდუქტის დამატება</span>
          </a>
        </div>
      }

      <button
        (click)="currencyService.toggleCurrency()"
        class="inline-flex items-center gap-2 px-3 py-1.5 bg-white hover:bg-gray-50 text-gray-700 dark:bg-gray-900 dark:hover:bg-gray-800 dark:text-gray-200 rounded-lg text-sm font-medium border border-gray-200 dark:border-gray-700 transition-colors duration-200 shadow-sm"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-4 h-4 text-gray-500 dark:text-gray-400"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-.856.12-1.685.342-2.47"
          />
        </svg>

        <span>{{ currencyService.currentCurrency() }}</span>
      </button>

      @if (isUserLoggedIn) {
        <a
          routerLink="/cart"
          class="relative p-2.5 text-slate-500 hover:text-indigo-600 bg-slate-50 hover:bg-indigo-50/50 rounded-xl transition-all duration-200 group mr-1 border border-slate-100/50"
          title="კალათა"
        >
          <svg
            class="w-5 h-5 transform group-hover:scale-105 transition-transform duration-200"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"
            />
          </svg>

          @if (cartService.cartItemsCount() > 0) {
            <span
              class="absolute -top-1.5 -right-1.5 bg-indigo-600 text-white text-[9px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-white animate-pulse shadow-sm shadow-indigo-600/30"
            >
              {{ cartService.cartItemsCount() }}
            </span>
          }
        </a>

        <div
          class="flex items-center gap-2.5 bg-slate-50/80 border border-slate-100/70 px-3.5 py-1.5 rounded-xl"
        >
          <div
            class="w-6 h-6 bg-indigo-50 border border-indigo-100/40 rounded-lg flex items-center justify-center text-indigo-600 text-xs shrink-0 font-bold shadow-sm"
          >
            {{ currentUser()?.charAt(0)?.toUpperCase() || 'U' }}
          </div>
          <div class="flex flex-col text-left hidden sm:flex">
            <span
              class="text-[9px] font-black uppercase tracking-widest text-slate-400 leading-none mb-0.5"
              >მომხმარებელი</span
            >
            <span class="text-xs font-black text-slate-800 leading-tight">
              {{ currentUser() }}
            </span>
          </div>
        </div>

        <button
          (click)="logout()"
          class="p-2.5 text-slate-400 hover:text-rose-600 bg-slate-50 hover:bg-rose-50/50 border border-slate-100/50 rounded-xl transition-all duration-200 group flex items-center justify-center"
          title="სისტემიდან გამოსვლა"
        >
          <svg
            class="w-4 h-4 transform group-hover:translate-x-0.5 transition-transform duration-200"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"
            />
          </svg>
        </button>
      } @else {
        <a
          routerLink="/login"
          class="text-sm font-bold text-indigo-600 hover:text-indigo-700 transition-colors px-3 py-2"
        >
          შესვლა
        </a>
      }
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 min-h-[calc(100vh-200px)]">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
