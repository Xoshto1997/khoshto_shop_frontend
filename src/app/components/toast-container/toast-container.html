<div class="fixed top-6 right-6 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  @for (toast of toasts(); track toast.id) {
    <div class="p-4 rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.04)] border backdrop-blur-xl transition-all duration-300 transform hover:scale-[1.02] pointer-events-auto flex items-center gap-3.5 animate-fadeIn"
         [class]="{
           'bg-emerald-50/95 border-emerald-100 text-emerald-800 shadow-emerald-950/5': toast.type === 'success',
           'bg-rose-50/95 border-rose-100 text-rose-800 shadow-rose-950/5': toast.type === 'danger',
           'bg-indigo-50/95 border-indigo-100 text-indigo-800 shadow-indigo-950/5': toast.type === 'info'
         }">
      
      @if (toast.type === 'success') { 
        <div class="w-7 h-7 bg-white rounded-xl flex items-center justify-center text-emerald-600 shadow-sm border border-emerald-100/40 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
          </svg>
        </div>
      }
      
      @if (toast.type === 'danger') { 
        <div class="w-7 h-7 bg-white rounded-xl flex items-center justify-center text-rose-600 shadow-sm border border-rose-100/40 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
          </svg>
        </div>
      }
      
      @if (toast.type === 'info') { 
        <div class="w-7 h-7 bg-white rounded-xl flex items-center justify-center text-indigo-600 shadow-sm border border-indigo-100/40 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.852l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/>
          </svg>
        </div>
      }

      <p class="text-xs sm:text-sm font-bold tracking-tight leading-snug">{{ toast.message }}</p>
    </div>
  }
</div>
