<div class="fixed top-6 right-6 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track toast.id) {
    <div class="p-4 rounded-2xl shadow-2xl border backdrop-blur-xl transition-all duration-300 pointer-events-auto flex items-center gap-3.5 animate-fadeIn"
         [ngClass]="{
           'bg-zinc-950/95 border-amber-500/40 shadow-amber-500/10': toast.type === 'success',
           'bg-zinc-950/95 border-rose-500/40 shadow-rose-900/20': toast.type === 'danger',
           'bg-zinc-950/95 border-sky-500/40 shadow-sky-500/10': toast.type === 'info' || toast.type === 'confirmation'
         }"
         [attr.role]="toast.type === 'danger' ? 'alert' : 'status'">
      
      @if (toast.type === 'success') { 
        <div class="w-8 h-8 bg-black/40 rounded-xl flex items-center justify-center text-amber-400 shadow-inner border border-amber-500/30 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
          </svg>
        </div>
      }
      
      @if (toast.type === 'danger') { 
        <div class="w-8 h-8 bg-black/40 rounded-xl flex items-center justify-center text-rose-400 shadow-inner border border-rose-500/40 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
          </svg>
        </div>
      }
      
      @if (toast.type === 'info' || toast.type === 'confirmation') {
        <div class="w-8 h-8 bg-black/40 rounded-xl flex items-center justify-center text-sky-300 shadow-inner border border-sky-500/30 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.852l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/>
          </svg>
        </div>
      }

      <div class="flex-1 min-w-0">
        <p class="text-xs sm:text-sm font-bold tracking-tight leading-snug text-white/90">{{ toast.message }}</p>
        @if (toast.type === 'confirmation') {
          <div class="mt-3 flex justify-end gap-2">
            <button type="button" (click)="toastService.dismiss(toast.id)" class="px-3 py-1.5 rounded-lg border border-zinc-700 text-xs font-bold text-zinc-300 hover:bg-zinc-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-400">
              არა
            </button>
            <button type="button" (click)="toastService.accept(toast.id)" class="px-3 py-1.5 rounded-lg bg-sky-600 text-xs font-bold text-white hover:bg-sky-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300">
              კი, დავაკოპირო
            </button>
          </div>
        }
      </div>
      <button type="button" (click)="toastService.dismiss(toast.id)" [attr.aria-label]="'შეტყობინების დახურვა'" class="p-1 text-zinc-400 hover:text-white rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
