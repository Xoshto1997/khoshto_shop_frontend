<div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-slate-50 to-slate-100/50 px-4 animate-fadeIn">
  <div class="max-w-md w-full bg-white rounded-[32px] shadow-[0_8px_30px_rgb(0,0,0,0.02)] border border-slate-100 p-8 sm:p-10 transition-all duration-300 hover:shadow-[0_8px_40px_rgba(148,163,184,0.08)]">
    
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-100/50 shadow-sm shadow-indigo-600/5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/>
        </svg>
      </div>
      <h2 class="text-2xl font-black text-slate-900 tracking-tight">პაროლის აღდგენა</h2>
      <p class="text-sm text-slate-400 mt-2 leading-relaxed px-4">შეიყვანეთ ელ. ფოსტა აღდგენის ინსტრუქციის მისაღებად</p>
    </div>

    @if (successMessage()) {
      <div class="mb-6 p-4 bg-emerald-50/70 border border-emerald-100/80 text-emerald-700 text-xs font-bold rounded-2xl flex items-center gap-3 animate-fadeIn shadow-sm shadow-emerald-600/5">
        <svg class="w-5 h-5 text-emerald-600 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ successMessage() }}</span>
      </div>
    }

    @if (errorMessage()) {
      <div class="mb-6 p-4 bg-rose-50/70 border border-rose-100/80 text-rose-700 text-xs font-bold rounded-2xl flex items-center gap-3 animate-fadeIn shadow-sm shadow-rose-600/5">
        <svg class="w-5 h-5 text-rose-600 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 px-1">ელ. ფოსტა</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5H4.5a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
            </svg>
          </span>
          <input 
            type="email" 
            formControlName="email"
            placeholder="name@example.com"
            class="w-full pl-11 pr-4 py-3.5 rounded-2xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 transition-all duration-200 text-sm font-medium text-slate-800 placeholder-slate-400 shadow-inner"
          />
        </div>
      </div>

      <button 
        type="submit"
        [disabled]="isLoading() || forgotForm.invalid"
        class="w-full bg-slate-900 hover:bg-indigo-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold py-4 px-4 rounded-2xl shadow-md shadow-slate-900/5 hover:shadow-lg hover:shadow-indigo-600/10 transition-all duration-300 text-sm flex justify-center items-center gap-2 active:scale-[0.98]"
      >
        @if (isLoading()) {
          <svg class="animate-spin h-5 w-5 text-current" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>იგზავნება...</span>
        } @else {
          <span>ლინკის გაგზავნა</span>
        }
      </button>
    </form>

    <div class="text-center mt-6">
      <a routerLink="/login" class="inline-flex items-center gap-2 text-xs font-bold text-slate-400 hover:text-indigo-600 transition-colors duration-200 group">
        <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
        </svg>
        <span>უკან ავტორიზაციაზე</span>
      </a>
    </div>

  </div>
</div>
